name: h-smart-ai-do

services:
  ai-service:
    image: h-smart-ai-service:latest
    container_name: h-smart-ai-service-do
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    environment:
      AI_MODEL_DIR: /app/models
      AI_SCORE_THRESHOLD: "0.4"
      WEB_CONCURRENCY: "1"
      GUNICORN_THREADS: "2"
      GUNICORN_TIMEOUT: "180"
    ports:
      - "0.0.0.0:8002:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
