spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://product-postgres-db:5432/hsmart_product_db}
    username: ${SPRING_DATASOURCE_USERNAME:hsmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hsmart_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:hsmart}
    password: ${SPRING_RABBITMQ_PASSWORD:hsmart_password}
    template:
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        max-interval: 5s
        multiplier: 2
server:
  port: ${SERVER_PORT:8082}
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8000}
services:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8002}
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
  level:
    com.hsmart.backend: INFO
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
