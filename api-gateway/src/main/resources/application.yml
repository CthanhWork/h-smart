server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      default-filters:
        - AuthenticationFilter
      httpclient:
        connect-timeout: 2000
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:120s}
      routes:
        - id: user-auth-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-location-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/locations/**
        - id: user-profile-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: product-category-create-route
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/categories
            - Method=POST
        - id: product-category-read-route
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/categories
            - Method=GET
        - id: product-route
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
        - id: search-route
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchCircuitBreaker
                fallbackUri: forward:/fallback/search
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: review-route
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**
        - id: report-route
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/reports/**
        - id: admin-route
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**
        - id: predict-route
          uri: ${AI_SERVICE_URL:http://ai-service:8000}
          predicates:
            - Path=/api/v1/predict/**
          filters:
            - name: CircuitBreaker
              args:
                name: predictCircuitBreaker
                fallbackUri: forward:/fallback/predict
        - id: interaction-websocket-route
          uri: lb:ws://interaction-service
          predicates:
            - Path=/api/v1/interactions/ws,/api/v1/interactions/ws/**
        - id: interaction-route
          uri: lb://interaction-service
          predicates:
            - Path=/api/v1/interactions/**
        - id: assistant-history-route
          uri: lb://interaction-service
          predicates:
            - Path=/api/v1/assistant/history
            - Method=GET,DELETE
        - id: assistant-generation-route
          uri: lb://interaction-service
          predicates:
            - Path=/api/v1/assistant/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@assistantRedisRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"
                status-code: TOO_MANY_REQUESTS
                assistant-redis-rate-limiter.replenishRate: ${ASSISTANT_RATE_LIMIT_REPLENISH_RATE:5}
                assistant-redis-rate-limiter.burstCapacity: ${ASSISTANT_RATE_LIMIT_BURST_CAPACITY:10}
                assistant-redis-rate-limiter.refillPeriodSeconds: ${ASSISTANT_RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
            - name: CircuitBreaker
              args:
                name: assistantCircuitBreaker
                fallbackUri: forward:/fallback/assistant

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  timelimiter:
    instances:
      assistantCircuitBreaker:
        timeoutDuration: ${ASSISTANT_CIRCUIT_BREAKER_TIMEOUT:60s}
        cancelRunningFuture: false
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      assistantCircuitBreaker:
        base-config: default
      searchCircuitBreaker:
        base-config: default
      predictCircuitBreaker:
        base-config: default

logging:
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
  level:
    com.hsmart.gateway: INFO

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

app:
  jwt:
    secret: ${JWT_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-user-rpm: ${RATE_LIMIT_PER_USER_RPM:100}
    per-ip-rpm: ${RATE_LIMIT_PER_IP_RPM:200}
    per-endpoint:
      search: ${RATE_LIMIT_SEARCH_RPM:20}
      upload: ${RATE_LIMIT_UPLOAD_RPM:10}
      predict: ${RATE_LIMIT_PREDICT_RPM:15}

internal:
  security:
    secret: ${INTERNAL_SHARED_SECRET:}
