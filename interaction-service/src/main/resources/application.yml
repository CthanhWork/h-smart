server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: interaction-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://interaction-mongo-db:27017/hsmart_interaction_db}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:hsmart}
    password: ${SPRING_RABBITMQ_PASSWORD:hsmart_password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 5s
          multiplier: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html

assistant:
  provider-url: ${AI_PROVIDER_URL:https://api.openai.com/v1}
  api-key: ${AI_PROVIDER_API_KEY:}
  model: ${AI_PROVIDER_MODEL:}
  connect-timeout-ms: ${AI_PROVIDER_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_PROVIDER_READ_TIMEOUT_MS:60000}
  history-limit: ${ASSISTANT_HISTORY_LIMIT:10}
  assistant-id: ${ASSISTANT_ID:h-smart-assistant}
  system-prompt: ${ASSISTANT_SYSTEM_PROMPT:You are H-Smart Assistant for H-Smart marketplace buying and selling tasks only. Always answer in Vietnamese unless requested otherwise. Only support product search, product details, buying, selling, orders, offers, shipping guidance, wishlist, account actions needed for buying or selling, and H-Smart policies related to marketplace transactions. If a request is outside H-Smart buying or selling scope, reply briefly that you only support H-Smart marketplace buying and selling tasks. Do not invent product, order, account, seller, shipping, or policy data. Keep answers short, direct, and task-focused.}
  temperature: ${ASSISTANT_TEMPERATURE:0.3}
  max-tokens: ${ASSISTANT_MAX_TOKENS:400}
  frequency-penalty: ${ASSISTANT_FREQUENCY_PENALTY:0.3}
  product-description-temperature: ${ASSISTANT_PRODUCT_DESCRIPTION_TEMPERATURE:0.7}
  product-description-max-tokens: ${ASSISTANT_PRODUCT_DESCRIPTION_MAX_TOKENS:200}
  intent-classifier:
    connect-timeout-ms: ${ASSISTANT_INTENT_CLASSIFIER_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ASSISTANT_INTENT_CLASSIFIER_READ_TIMEOUT_MS:5000}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://product-service}
  page-size: ${PRODUCT_SERVICE_PAGE_SIZE:30}
  connect-timeout-ms: ${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}

order-service:
  base-url: ${ORDER_SERVICE_BASE_URL:http://order-service}
  connect-timeout-ms: ${ORDER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${ORDER_SERVICE_READ_TIMEOUT_MS:3000}

policy-search:
  base-url: ${POLICY_SEARCH_BASE_URL:http://h-smart-elasticsearch:9200}
  index-name: ${POLICY_SEARCH_INDEX_NAME:hsmart-policy-index}
  page-size: ${POLICY_SEARCH_PAGE_SIZE:2}
  connect-timeout-ms: ${POLICY_SEARCH_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${POLICY_SEARCH_READ_TIMEOUT_MS:3000}

internal:
  security:
    enabled: ${INTERNAL_SECURITY_ENABLED:true}
    secret: ${INTERNAL_SHARED_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      productCatalogCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      intentClassifierCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
  level:
    com.hsmart.backend: INFO

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
