spring:
  datasource:
    url: jdbc:h2:mem:user-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  main:
    allow-bean-definition-overriding: true
  cloud:
    discovery:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
    dynamic: false
  mail:
    host: localhost
    port: 1025
app:
  jwt:
    secret: UFdHZG1lU3Q2UTNYV2lBc1pDajFuWWtFaWpNd2pmd0h6aFZ4T3V0bE1YQU5SVEtrQ1VGVW9vV1h6S1J4bw==
    expiration-ms: 86400000
  mail:
    enabled: false
    from: no-reply@hsmart.local
account:
  lifecycle:
    frontend-base-url: http://localhost:5173
    verification-token-minutes: 1440
    password-reset-token-minutes: 30
springdoc:
  api-docs:
    enabled: false
internal:
  security:
    enabled: false
eureka:
  client:
    enabled: false
