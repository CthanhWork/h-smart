server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://order-postgres-db:5432/hsmart_order_db}
    username: ${SPRING_DATASOURCE_USERNAME:hsmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hsmart_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:hsmart}
    password: ${SPRING_RABBITMQ_PASSWORD:hsmart_password}
    template:
      observation-enabled: true
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        max-interval: 5s
        multiplier: 2

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://product-service}
  connect-timeout-ms: ${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://user-service}
  connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:3000}

interaction-service:
  base-url: ${INTERACTION_SERVICE_BASE_URL:http://interaction-service}
  connect-timeout-ms: ${INTERACTION_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INTERACTION_SERVICE_READ_TIMEOUT_MS:3000}

ghtk:
  api-url: ${GHTK_API_URL:https://services.giaohangtietkiem.vn}
  api-token: ${GHTK_API_TOKEN:}
  connect-timeout-ms: ${GHTK_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${GHTK_READ_TIMEOUT_MS:5000}
  default-weight-grams: ${GHTK_DEFAULT_WEIGHT_GRAMS:1000}
  client-source: ${GHTK_CLIENT_SOURCE:}
  webhook-hash: ${GHTK_WEBHOOK_HASH:}

viettel-post:
  api-url: ${VIETTEL_POST_API_URL:https://partnerdev.viettelpost.vn}
  username: ${VIETTEL_POST_USERNAME:}
  password: ${VIETTEL_POST_PASSWORD:}
  connect-timeout-ms: ${VIETTEL_POST_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${VIETTEL_POST_READ_TIMEOUT_MS:5000}
  default-weight-grams: ${VIETTEL_POST_DEFAULT_WEIGHT_GRAMS:1000}
  service-code: ${VIETTEL_POST_SERVICE_CODE:VCN}
  service-extra: ${VIETTEL_POST_SERVICE_EXTRA:}
  product-type: ${VIETTEL_POST_PRODUCT_TYPE:HH}
  order-payment: ${VIETTEL_POST_ORDER_PAYMENT:3}
  check-unique: ${VIETTEL_POST_CHECK_UNIQUE:true}

orders:
  pending-timeout-minutes: ${ORDER_PENDING_TIMEOUT_MINUTES:30}
  pending-timeout-scan-ms: ${ORDER_PENDING_TIMEOUT_SCAN_MS:60000}

internal:
  security:
    enabled: ${INTERNAL_SECURITY_ENABLED:true}
    secret: ${INTERNAL_SHARED_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
  level:
    com.hsmart.order: INFO

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
