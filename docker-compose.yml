services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: h-smart-ai-service
    environment:
      AI_MODEL_DIR: /app/models
      AI_SCORE_THRESHOLD: "0.4"
    ports:
      - "8002:8000"
    volumes:
      - ./ai-service/models:/app/models
      - ./ai-service/tests:/app/tests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-postgres-db
    environment:
      POSTGRES_DB: hsmart
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: h-smart-backend-service
    environment:
      SERVER_PORT: "8080"
      APP_PUBLIC_BASE_URL: http://localhost:8080
      AI_SERVICE_BASE_URL: http://ai-service:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hsmart
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      STORAGE_UPLOAD_DIR: /app/uploads
    depends_on:
      ai-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend-service/uploads:/app/uploads

  user-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-user-postgres-db
    environment:
      POSTGRES_DB: hsmart_user_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-product-postgres-db
    environment:
      POSTGRES_DB: hsmart_product_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5434:5432"
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  interaction-mongo-db:
    image: mongo:7
    container_name: h-smart-interaction-mongo-db
    ports:
      - "27017:27017"
    volumes:
      - interaction-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" localhost:27017/test | grep 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: h-smart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hsmart
      RABBITMQ_DEFAULT_PASS: hsmart_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: h-smart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zipkin:
    image: openzipkin/zipkin:3
    container_name: h-smart-zipkin
    ports:
      - "9411:9411"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: h-smart-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: h-smart-logstash
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "5044:5044"
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: h-smart-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: h-smart-user-service
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres-db:5432/hsmart_user_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      JWT_SECRET: UFdHZG1lU3Q2UTNYV2lBc1pDajFuWWtFaWpNd2pmd0h6aFZ4T3V0bE1YQU5SVEtrQ1VGVW9vV1h6S1J4bw==
      JWT_EXPIRATION_MS: "86400000"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
    depends_on:
      user-postgres-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: h-smart-product-service
    environment:
      SERVER_PORT: "8082"
      APP_PUBLIC_BASE_URL: http://localhost:8000
      AI_SERVICE_BASE_URL: http://ai-service:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-postgres-db:5432/hsmart_product_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      STORAGE_UPLOAD_DIR: /app/uploads
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
    depends_on:
      ai-service:
        condition: service_healthy
      product-postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ./product-service/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  interaction-service:
    build:
      context: ./interaction-service
      dockerfile: Dockerfile
    container_name: h-smart-interaction-service
    environment:
      SERVER_PORT: "8083"
      SPRING_DATA_MONGODB_URI: mongodb://interaction-mongo-db:27017/hsmart_interaction_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      ASSISTANT_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ASSISTANT_OLLAMA_MODEL: qwen3:4b-instruct
      ASSISTANT_HISTORY_LIMIT: "10"
      PRODUCT_SERVICE_BASE_URL: http://product-service:8082
      PRODUCT_SERVICE_PAGE_SIZE: "30"
      PRODUCT_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      PRODUCT_SERVICE_READ_TIMEOUT_MS: "3000"
    depends_on:
      interaction-mongo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: h-smart-api-gateway
    environment:
      SERVER_PORT: "8000"
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INTERACTION_SERVICE_URL: http://interaction-service:8083
      INTERACTION_SERVICE_WS_URL: ws://interaction-service:8083
      JWT_SECRET: UFdHZG1lU3Q2UTNYV2lBc1pDajFuWWtFaWpNd2pmd0h6aFZ4T3V0bE1YQU5SVEtrQ1VGVW9vV1h6S1J4bw==
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      GATEWAY_RESPONSE_TIMEOUT: 120s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ASSISTANT_RATE_LIMIT_REPLENISH_RATE: "5"
      ASSISTANT_RATE_LIMIT_BURST_CAPACITY: "10"
      ASSISTANT_RATE_LIMIT_REFILL_PERIOD_SECONDS: "60"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      interaction-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  user-postgres-data:
  product-postgres-data:
  interaction-mongo-data:
  rabbitmq-data:
  elasticsearch-data:
