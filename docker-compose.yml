services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: h-smart-ai-service
    environment:
      AI_MODEL_DIR: /app/models
      AI_SCORE_THRESHOLD: "0.4"
    ports:
      - "8002:8000"
    volumes:
      - ./ai-service/models:/app/models
      - ./ai-service/tests:/app/tests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-postgres-db
    environment:
      POSTGRES_DB: hsmart
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: h-smart-backend-service
    environment:
      SERVER_PORT: "8080"
      APP_PUBLIC_BASE_URL: http://localhost:8080
      AI_SERVICE_BASE_URL: http://ai-service:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hsmart
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      STORAGE_UPLOAD_DIR: /app/uploads
    depends_on:
      ai-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend-service/uploads:/app/uploads

  user-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-user-postgres-db
    environment:
      POSTGRES_DB: hsmart_user_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-product-postgres-db
    environment:
      POSTGRES_DB: hsmart_product_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5434:5432"
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-order-postgres-db
    environment:
      POSTGRES_DB: hsmart_order_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  review-postgres-db:
    image: postgres:16-alpine
    container_name: h-smart-review-postgres-db
    environment:
      POSTGRES_DB: hsmart_review_db
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: hsmart_password
    ports:
      - "5436:5432"
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart_review_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  interaction-mongo-db:
    image: mongo:7
    container_name: h-smart-interaction-mongo-db
    ports:
      - "27017:27017"
    volumes:
      - interaction-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" localhost:27017/test | grep 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: h-smart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hsmart
      RABBITMQ_DEFAULT_PASS: hsmart_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: h-smart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zipkin:
    image: openzipkin/zipkin:3
    container_name: h-smart-zipkin
    ports:
      - "9411:9411"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: h-smart-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: h-smart-logstash
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "5044:5044"
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: h-smart-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: h-smart-discovery-server
    environment:
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: h-smart-user-service
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres-db:5432/hsmart_user_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      JWT_SECRET: UFdHZG1lU3Q2UTNYV2lBc1pDajFuWWtFaWpNd2pmd0h6aFZ4T3V0bE1YQU5SVEtrQ1VGVW9vV1h6S1J4bw==
      JWT_EXPIRATION_MS: "86400000"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@hsmart.local}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      user-postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: h-smart-product-service
    environment:
      SERVER_PORT: "8082"
      APP_PUBLIC_BASE_URL: http://localhost:8000
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      AI_SERVICE_READ_TIMEOUT_MS: "5000"
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-postgres-db:5432/hsmart_product_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      PRICING_AVERAGE_REFRESH_CRON: "0 0 * * * *"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      STORAGE_UPLOAD_DIR: /app/uploads
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      product-postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ./product-service/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  interaction-service:
    build:
      context: ./interaction-service
      dockerfile: Dockerfile
    container_name: h-smart-interaction-service
    environment:
      SERVER_PORT: "8083"
      SPRING_DATA_MONGODB_URI: mongodb://interaction-mongo-db:27017/hsmart_interaction_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:?Set AI_PROVIDER_API_KEY in .env or shell before starting Docker Compose}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:?Set AI_PROVIDER_MODEL in .env or shell before starting Docker Compose}
      AI_PROVIDER_CONNECT_TIMEOUT_MS: "2000"
      AI_PROVIDER_READ_TIMEOUT_MS: "60000"
      ASSISTANT_INTENT_CLASSIFIER_CONNECT_TIMEOUT_MS: "1000"
      ASSISTANT_INTENT_CLASSIFIER_READ_TIMEOUT_MS: "5000"
      ASSISTANT_HISTORY_LIMIT: "10"
      PRODUCT_SERVICE_BASE_URL: http://product-service
      PRODUCT_SERVICE_PAGE_SIZE: "30"
      PRODUCT_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      PRODUCT_SERVICE_READ_TIMEOUT_MS: "3000"
      ORDER_SERVICE_BASE_URL: http://order-service
      ORDER_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      ORDER_SERVICE_READ_TIMEOUT_MS: "3000"
      POLICY_SEARCH_BASE_URL: http://h-smart-elasticsearch:9200
      POLICY_SEARCH_INDEX_NAME: hsmart-policy-index
      POLICY_SEARCH_PAGE_SIZE: "2"
      POLICY_SEARCH_CONNECT_TIMEOUT_MS: "1000"
      POLICY_SEARCH_READ_TIMEOUT_MS: "3000"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      interaction-mongo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: h-smart-search-service
    environment:
      SERVER_PORT: "8084"
      SPRING_ELASTICSEARCH_URIS: http://h-smart-elasticsearch:9200
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: h-smart-order-service
    mem_limit: 400m
    environment:
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres-db:5432/hsmart_order_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      PRODUCT_SERVICE_BASE_URL: http://product-service
      PRODUCT_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      PRODUCT_SERVICE_READ_TIMEOUT_MS: "3000"
      USER_SERVICE_BASE_URL: http://user-service
      USER_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      USER_SERVICE_READ_TIMEOUT_MS: "3000"
      GHTK_API_URL: ${GHTK_API_URL:-https://services.giaohangtietkiem.vn}
      GHTK_API_TOKEN: ${GHTK_API_TOKEN:-}
      GHTK_CONNECT_TIMEOUT_MS: "2000"
      GHTK_READ_TIMEOUT_MS: "5000"
      GHTK_DEFAULT_WEIGHT_GRAMS: "1000"
      GHTK_CLIENT_SOURCE: ${GHTK_CLIENT_SOURCE:-}
      GHTK_WEBHOOK_HASH: ${GHTK_WEBHOOK_HASH:-}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      order-postgres-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: h-smart-review-service
    mem_limit: 400m
    environment:
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-postgres-db:5432/hsmart_review_db
      SPRING_DATASOURCE_USERNAME: hsmart
      SPRING_DATASOURCE_PASSWORD: hsmart_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: hsmart
      SPRING_RABBITMQ_PASSWORD: hsmart_password
      ORDER_SERVICE_BASE_URL: http://order-service
      ORDER_SERVICE_CONNECT_TIMEOUT_MS: "2000"
      ORDER_SERVICE_READ_TIMEOUT_MS: "3000"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      review-postgres-db:
        condition: service_healthy
      order-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Internal-Secret: $$INTERNAL_SHARED_SECRET\" http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: h-smart-api-gateway
    environment:
      SERVER_PORT: "8000"
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: UFdHZG1lU3Q2UTNYV2lBc1pDajFuWWtFaWpNd2pmd0h6aFZ4T3V0bE1YQU5SVEtrQ1VGVW9vV1h6S1J4bw==
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      GATEWAY_RESPONSE_TIMEOUT: 120s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ASSISTANT_RATE_LIMIT_REPLENISH_RATE: "5"
      ASSISTANT_RATE_LIMIT_BURST_CAPACITY: "10"
      ASSISTANT_RATE_LIMIT_REFILL_PERIOD_SECONDS: "60"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?Set INTERNAL_SHARED_SECRET in .env or shell before starting Docker Compose}
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      interaction-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  user-postgres-data:
  product-postgres-data:
  order-postgres-data:
  review-postgres-data:
  interaction-mongo-data:
  rabbitmq-data:
  elasticsearch-data:
